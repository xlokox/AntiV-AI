version: '3.8'

services:
  antiv-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: antiv-api-secure
    restart: unless-stopped
    
    # Security: Run as non-root user
    user: "1000:1000"
    
    # Security: No new privileges
    security_opt:
      - no-new-privileges:true
    
    # Security: Drop all capabilities, add only necessary ones
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    
    # Security: Read-only root filesystem
    read_only: true
    
    # Security: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Security: Temporary filesystems for writable directories
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/tmp:noexec,nosuid,size=50m
    
    # Volumes with security options
    volumes:
      # Application code (read-only)
      - ./src:/app/src:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./start_secure_backend.py:/app/start_secure_backend.py:ro
      
      # Data directories (read-write with restrictions)
      - antiv-data:/app/data:rw,noexec,nosuid
      - antiv-logs:/app/logs:rw,noexec,nosuid
      - antiv-uploads:/app/uploads:rw,noexec,nosuid
      - antiv-backups:/app/backups:rw,noexec,nosuid
      - antiv-certs:/app/certs:rw,noexec,nosuid
    
    # Network configuration
    ports:
      - "8000:8000"
    networks:
      - antiv-network
    
    # Environment variables
    environment:
      - PYTHONPATH=/app/src
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-auto-generated}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AntiV-AI-Admin-2024!}
      - ENVIRONMENT=production
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for distributed processing (future use)
  redis:
    image: redis:7-alpine
    container_name: antiv-redis
    restart: unless-stopped
    
    # Security hardening
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    
    # Temporary filesystem
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    
    # Data volume
    volumes:
      - redis-data:/data:rw,noexec,nosuid
    
    networks:
      - antiv-network
    
    # Redis configuration
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for distributed processing (future use)
  postgres:
    image: postgres:15-alpine
    container_name: antiv-postgres
    restart: unless-stopped
    
    # Security hardening
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    
    # Data volume
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw,noexec,nosuid
    
    networks:
      - antiv-network
    
    # Environment variables
    environment:
      - POSTGRES_DB=antiv_ai
      - POSTGRES_USER=antiv_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password_change_me}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiv_user -d antiv_ai"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vulnerability scanner (Trivy)
  trivy-scanner:
    image: aquasec/trivy:latest
    container_name: antiv-trivy
    profiles:
      - security-scan
    
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    
    # Temporary filesystem
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    
    # Scan the main application image
    command: >
      image --exit-code 1 --severity HIGH,CRITICAL
      --format json --output /tmp/trivy-report.json
      antiv-ai:latest
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./security-reports:/tmp:rw

# Networks
networks:
  antiv-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: antiv-br0
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes with security labels
volumes:
  antiv-data:
    driver: local
    driver_opts:
      type: none
      o: bind,noexec,nosuid
      device: ./data
  
  antiv-logs:
    driver: local
    driver_opts:
      type: none
      o: bind,noexec,nosuid
      device: ./logs
  
  antiv-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind,noexec,nosuid
      device: ./uploads
  
  antiv-backups:
    driver: local
    driver_opts:
      type: none
      o: bind,noexec,nosuid
      device: ./backups
  
  antiv-certs:
    driver: local
    driver_opts:
      type: none
      o: bind,noexec,nosuid
      device: ./certs
  
  redis-data:
    driver: local
  
  postgres-data:
    driver: local
